# BONUS: launch app-2 at 10.0.2.11, install the same backend on it, then enable this.
upstream shopbondhu_api {
    server 10.0.2.10:8000 max_fails=2 fail_timeout=10s;
    server 10.0.2.11:8000 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    server_name _; # Replace with your domain for the HTTPS bonus.
    root /var/www/shopbondhu;
    index index.html;

    location /api/ {
        proxy_pass http://shopbondhu_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
